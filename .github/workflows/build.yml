name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke test and pack
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore with lock files
        run: dotnet restore Mordex.sln --locked-mode

      - name: Build
        run: dotnet build Mordex.sln -c Release --no-restore

      - name: Smoke test every control
        run: dotnet run --project demo/Mordex.Demo -c Release --no-build -- --smoke

      - name: Pack
        run: dotnet pack pack/Mordex.Windows.Package -c Release -o artifacts/nuget --no-build
